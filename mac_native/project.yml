name: LifeManager
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  LifeManager:
    type: application
    platform: macOS
    sources:
      - path: LifeManager
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: LifeManager/Assets.xcassets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naboulsi.lifemanager
        INFOPLIST_FILE: LifeManager/Info.plist
        CODE_SIGN_ENTITLEMENTS: LifeManager/LifeManager.entitlements
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
