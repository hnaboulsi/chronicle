name: Chronicle
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  Chronicle:
    type: application
    platform: macOS
    sources:
      - path: Chronicle
        excludes:
          - Info.plist
          - MenuBarManager.swift
          - MenuBarView.swift
          - "*.entitlements"
      - path: ChronicleAgent
        excludes:
          - Info.plist
          - ChronicleAgentApp.swift
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Chronicle
        PRODUCT_BUNDLE_IDENTIFIER: com.naboulsi.chronicle
        INFOPLIST_FILE: Chronicle/Info.plist
        OTHER_CODE_SIGN_FLAGS: "- --identifier $(PRODUCT_BUNDLE_IDENTIFIER)"
    scheme:
      gatherCoverageData: false
